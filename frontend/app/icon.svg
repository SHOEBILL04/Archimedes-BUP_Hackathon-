<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <!-- Circular Backplate for contrast across all browser tab themes -->
  <circle cx="70" cy="70" r="68" fill="#0F172A" />
  
  <!-- Outer Equilibrium Orbit / Ring -->
  <circle cx="70" cy="70" r="54" fill="none" stroke="#0EA5E9" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Solar / Clean Renewable Arc (Emerald #10B981) -->
  <path d="M 70 16 A 54 54 0 0 1 124 70" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" />

  <!-- Smart Grid / Storage Arc (Electric Cyan #0EA5E9) -->
  <path d="M 70 124 A 54 54 0 0 1 16 70" fill="none" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round" />

  <!-- Fulcrum Base Plate -->
  <circle cx="70" cy="70" r="32" fill="#1E293B" stroke="#334155" stroke-width="2" />

  <!-- The Archimedes "A" Fulcrum -->
  <polygon points="70,42 54,80 86,80" fill="#10B981" />
  
  <!-- Fulcrum Cross-Tie Cutout -->
  <line x1="58" y1="72" x2="82" y2="72" stroke="#0F172A" stroke-width="3" />

  <!-- Energy Balance Nodes -->
  <circle cx="70" cy="16" r="5" fill="#10B981" />
  <circle cx="70" cy="124" r="5" fill="#0EA5E9" />
  <circle cx="70" cy="53" r="3" fill="#FFFFFF" />
</svg>
