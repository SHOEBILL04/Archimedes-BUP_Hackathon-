<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="fav-emerald" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fav-cyan" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Modern Work-Focused Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#fav-bg)" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Subtle Mathematical Optimization Grid Crosshair -->
  <line x1="22" y1="52" x2="78" y2="52" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.4" />
  <line x1="50" y1="22" x2="50" y2="78" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.4" />

  <!-- The "A" Energy Fulcrum Apex & Arms -->
  <path d="M 31 73 L 50 25" stroke="url(#fav-emerald)" stroke-width="7" stroke-linecap="round" />
  <path d="M 50 25 L 69 73" stroke="url(#fav-cyan)" stroke-width="7" stroke-linecap="round" />

  <!-- Horizontal Energy Equilibrium Balance Beam -->
  <path d="M 23 52 L 77 52" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

  <!-- Center Optimal Nexus Node -->
  <circle cx="50" cy="52" r="5" fill="#10B981" />
  <circle cx="50" cy="52" r="2.2" fill="#FFFFFF" />

  <!-- Energy Balance Endpoints -->
  <circle cx="23" cy="52" r="3" fill="#10B981" />
  <circle cx="78" cy="52" r="3" fill="#38BDF8" />
</svg>
