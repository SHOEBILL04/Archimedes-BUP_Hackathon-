# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Project: Smart Campus Energy Optimization Platform (Archimedes)
#
# Deploy both services in ONE SHOT:
# 1. In Render Dashboard (https://dashboard.render.com), click "New +" -> "Blueprint"
# 2. Select your GitHub repository: Archimedes-BUP_Hackathon-
# 3. Click "Apply" -> Render deploys both the backend and frontend together!
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND SERVICE: FastAPI + PuLP/CBC Linear Solver + SQLite Database
  # ----------------------------------------------------------------------------
  - type: web
    name: archimedes-energy-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt && cd backend && alembic upgrade head"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite:///./data/smart_campus_energy.db"

